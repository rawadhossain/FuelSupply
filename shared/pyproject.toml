[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuelsupply-shared"
version = "0.1.0"
description = "Shared Pydantic models for the Fuel Supply Intelligence & Resilience Platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["fuelsupply_shared*"]
