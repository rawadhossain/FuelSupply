name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, intelligence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared package
        run: pip install -e ./shared
      - name: Install service dependencies
        run: pip install -r ${{ matrix.service }}/requirements.txt ruff pytest
      - name: Lint
        run: ruff check ${{ matrix.service }}
      - name: Test
        run: pytest ${{ matrix.service }} -q
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      - name: Build
        working-directory: frontend
        run: npm run build
