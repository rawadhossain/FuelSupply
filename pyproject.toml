[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "EXE002", # executable bit on source files is a Windows/git filesystem artifact here, not a real issue
  "UP045", # Optional[X] vs X | None in shared/fuelsupply_shared/models.py — app-owned code, not touched by DevOps
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing style debt from the Anindo branch integration (abrar/sync): that
# branch never ran ruff before merging, and its 53+ tests already pass against
# this behavior. Rewriting tested numerical/LP/LLM code under integration time
# pressure risks regressions for no behavior change — scoped out here rather
# than silenced repo-wide. Revisit as a dedicated cleanup pass if time allows.
"intelligence/*.py" = ["BLE001", "SIM115", "B023", "S110"]
