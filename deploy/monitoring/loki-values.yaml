# Minimal single-binary Loki for the kind demo cluster. Installed only when
# LOGS=1 is passed to scripts/k8s-up.sh. If used, provision a Loki datasource
# in kube-prometheus-stack's Grafana with uid "loki" to match dashboard panels
# that reference log queries (see scripts/sync-k8s-assets.sh notes).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
gateway:
  enabled: false
