services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      # Demo default: 1 tick ~= 1 wall-clock second, easier to narrate live. Was 8.
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  chaos-proxy:
    build:
      context: ./ops/chaos-proxy
      dockerfile: Dockerfile
    environment:
      UPSTREAM: ${CHAOS_PROXY_UPSTREAM:-http://simulator-api:8000}
    ports:
      - "127.0.0.1:${CHAOS_PROXY_PORT:-8090}:8000"
      - "127.0.0.1:${CHAOS_PROXY_CONTROL_PORT:-8001}:8001"
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      simulator-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/__chaos', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuelsupply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelsupply}
      POSTGRES_DB: ${POSTGRES_DB:-fuelsupply}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuelsupply}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      # Routed through chaos-proxy (not simulator-api directly) so the bad-payload demo
      # beat (ops/scenario-runner bad-payload) actually exercises core's degraded-mode
      # handling. chaos-proxy forwards to simulator-api unmodified in passthrough mode.
      SIMULATOR_BASE_URL: ${CORE_SIMULATOR_BASE_URL:-http://chaos-proxy:8000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fuelsupply}:${POSTGRES_PASSWORD:-fuelsupply}@postgres:5432/${POSTGRES_DB:-fuelsupply}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-http://intelligence:8200}
    ports:
      - "${CORE_PORT:-8100}:8100"
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      simulator-api:
        condition: service_healthy
      chaos-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  intelligence:
    build:
      context: .
      dockerfile: intelligence/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      INTEL_POLICY: ${INTEL_POLICY:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
      MODEL_VERSION: ${MODEL_VERSION:-profile-v1}
    ports:
      - "${INTELLIGENCE_PORT:-8200}:8200"
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CORE_UPSTREAM: ${CORE_UPSTREAM:-http://core:8100}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      core:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  alloy:
    image: grafana/alloy:v1.4.3
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8081}:8080"
    restart: unless-stopped
    mem_limit: 256m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-fuelsupply}:${POSTGRES_PASSWORD:-fuelsupply}@postgres:5432/${POSTGRES_DB:-fuelsupply}?sslmode=disable
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      redis:
        condition: service_healthy

  sim-exporter:
    build:
      context: ./ops/sim-exporter
      dockerfile: Dockerfile
    environment:
      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL:-http://simulator-api:8000}
    ports:
      - "127.0.0.1:${SIM_EXPORTER_PORT:-9101}:9101"
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      simulator-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fuel-command.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  grafana-data:
  prometheus-data:
  loki-data:
