services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "${SIMULATOR_PORT:-8000}:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuelsupply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelsupply}
      POSTGRES_DB: ${POSTGRES_DB:-fuelsupply}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuelsupply}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL:-http://simulator-api:8000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fuelsupply}:${POSTGRES_PASSWORD:-fuelsupply}@postgres:5432/${POSTGRES_DB:-fuelsupply}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-http://intelligence:8200}
    ports:
      - "${CORE_PORT:-8100}:8100"
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      simulator-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  intelligence:
    build:
      context: .
      dockerfile: intelligence/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "${INTELLIGENCE_PORT:-8200}:8200"
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CORE_UPSTREAM: ${CORE_UPSTREAM:-http://core:8100}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  grafana-data:
